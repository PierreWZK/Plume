<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plume · Des images légères, sans quitter votre navigateur</title>
  <meta name="description" content="Plume compresse vos photos pour le web directement dans votre navigateur : aucune image n'est envoyée sur un serveur.">
  <link rel="stylesheet" href="/src/styles.css">
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <main>
    <h1>Plume</h1>
    <label class="drop" id="drop">
      <input type="file" id="files" accept="image/jpeg,image/png,image/webp" multiple>
      <b>Déposez une photo ici</b>
      <span>ou cliquez pour la choisir · JPG, PNG, WEBP</span>
    </label>
    <form class="settings" id="settings">
      <fieldset>
        <legend>Niveau de compression</legend>
        <label><input type="radio" name="level" value="quality"> Qualité max</label>
        <label><input type="radio" name="level" value="balanced" checked> Équilibré</label>
        <label><input type="radio" name="level" value="light"> Poids min</label>
        <p class="hint" id="level-hint"></p>
      </fieldset>
      <label class="switch"><input type="checkbox" name="webp" id="webp"> Convertir en WebP</label>
      <p class="hint" id="webp-hint">Désactivé : chaque image garde son format d'origine.</p>
    </form>
    <ul class="results" id="results" aria-live="polite"></ul>
  </main>
</body>
</html>
